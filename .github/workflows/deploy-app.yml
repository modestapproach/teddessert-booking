name: Deploy booking app (CF Containers)

# PRIMARY DEPLOYMENT. Builds the Cal.com-fork Docker image and deploys it as a
# Cloudflare Worker + Container at book.teddessert.com (see app/wrangler.toml).
# `wrangler deploy` does the Docker build itself and pushes to Cloudflare's
# managed registry — GHCR is not involved (build-image.yml is a manual
# fallback for running the same image off Cloudflare).
#
# Secrets are synced from repository secrets of the same name. All seven must
# exist or the deploy fails at the preflight step below. Owner sign-in itself
# is Cloudflare Access (Google) on /owner-login — ACCESS_TEAM_DOMAIN/
# ACCESS_AUD/ACCESS_ALLOWED_EMAILS live as plain [vars] in wrangler.toml, not
# secrets, since none of them are sensitive.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Fail here with a readable message rather than deep inside
      # wrangler-action's secret upload ("Value for secret X not found in
      # environment"), which is what the first attempt at this workflow hit.
      - name: Check required secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          CALENDSO_ENCRYPTION_KEY: ${{ secrets.CALENDSO_ENCRYPTION_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_NAME: ${{ secrets.OWNER_NAME }}
          OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}
        run: |
          missing=()
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXTAUTH_SECRET \
                   CALENDSO_ENCRYPTION_KEY OWNER_EMAIL \
                   OWNER_NAME OWNER_USERNAME; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]} — add them under Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "All 7 required secrets are present."

      # The multi-stage cal build overruns the runner's default free space.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Yarn 4
        run: corepack enable && corepack prepare yarn@4.12.0 --activate

      # Host-side install is link-only; the real dependency install and build
      # happen inside the Dockerfile.
      - name: Install dependencies (host, link-only)
        working-directory: app
        env:
          HUSKY: "0"
        run: yarn install --mode=skip-build

      - name: Deploy to Cloudflare Containers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          wranglerVersion: "latest"
          secrets: |
            NEXTAUTH_SECRET
            CALENDSO_ENCRYPTION_KEY
            OWNER_EMAIL
            OWNER_NAME
            OWNER_USERNAME
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          CALENDSO_ENCRYPTION_KEY: ${{ secrets.CALENDSO_ENCRYPTION_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_NAME: ${{ secrets.OWNER_NAME }}
          OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}

      # A fresh container has to boot before it can answer, and the Worker
      # returns 503 "warming up" until it does — so retry rather than taking
      # the first response as the verdict. /owner-login sits behind
      # Cloudflare Access, so an unauthenticated CI request never reaches the
      # app — it gets Access's own 302 to the Google login page, which is
      # itself proof the container (and Access) are both up.
      - name: Smoke
        run: |
          for i in $(seq 1 12); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" https://book.teddessert.com/owner-login || echo 000)
            echo "attempt $i: /owner-login -> $code"
            case "$code" in 200|302|307) echo "up"; exit 0 ;; esac
            sleep 15
          done
          echo "::error::book.teddessert.com/owner-login never answered within ~3 minutes"
          exit 1
