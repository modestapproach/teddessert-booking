name: Deploy booking app (CF Containers)

# Builds the Cal.com-fork Docker image and deploys it as a Cloudflare Worker +
# Container at book.teddessert.com (see app/wrangler.toml). Secrets are synced
# from repository secrets of the same name.

on:
  push:
    branches: [standalone, main]
    paths:
      - "app/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The multi-stage cal build overruns the runner's default free space.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Yarn 4
        run: corepack enable && corepack prepare yarn@4.12.0 --activate

      - name: Install dependencies (host, link-only)
        working-directory: app
        env:
          HUSKY: "0"
        run: yarn install --mode=skip-build

      - name: Deploy to Cloudflare Containers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          wranglerVersion: "latest"
          secrets: |
            NEXTAUTH_SECRET
            CALENDSO_ENCRYPTION_KEY
            OWNER_PASSWORD
            OWNER_EMAIL
            OWNER_NAME
            OWNER_USERNAME
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          CALENDSO_ENCRYPTION_KEY: ${{ secrets.CALENDSO_ENCRYPTION_KEY }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_NAME: ${{ secrets.OWNER_NAME }}
          OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}

      - name: Smoke
        run: |
          sleep 20
          curl -sS -o /dev/null -w "book.teddessert.com/owner-login: %{http_code}\n" https://book.teddessert.com/owner-login
