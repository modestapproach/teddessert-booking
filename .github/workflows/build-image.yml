name: Build booking image (GHCR)

# FALLBACK PATH — manual only. The primary deployment is deploy-app.yml
# (Cloudflare Containers), which builds this same Dockerfile itself; running
# both on every push would build the image twice for nothing.
#
# Run this by hand when you want the image runnable somewhere other than
# Cloudflare — any Linux box via deploy/docker-compose.yml, or to keep a
# known-good `:<sha>` tag to roll back to:
#   ghcr.io/modestapproach/teddessert-booking:latest

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The multi-stage cal build overruns the runner's default free space.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_* build args already default correctly in app/Dockerfile —
      # do not override them here.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          provenance: false
          tags: |
            ghcr.io/modestapproach/teddessert-booking:latest
            ghcr.io/modestapproach/teddessert-booking:${{ github.sha }}

      - name: Disk after build
        if: always()
        run: df -h /
