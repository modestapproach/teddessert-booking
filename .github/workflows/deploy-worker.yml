name: Deploy booking app (Cloudflare Workers)

# Builds the Cal.com fork with OpenNext and deploys it as a Cloudflare Worker
# at book.teddessert.com — the same path dibslist uses for book.dibslist.app.
# No container, no box: per-request billing on the Workers plan.
#
# Repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (deploy auth), and
# NEXTAUTH_SECRET, CALENDSO_ENCRYPTION_KEY, OWNER_PASSWORD, OWNER_EMAIL,
# OWNER_NAME, OWNER_USERNAME (synced into the Worker as secrets).

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app/apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Yarn 4
        working-directory: app
        run: corepack enable && corepack prepare yarn@4.12.0 --activate

      - name: Install dependencies
        working-directory: app
        env:
          HUSKY: "0"
        run: yarn install

      # NEXT_PUBLIC_* are inlined at `next build`; the two secret placeholders
      # only satisfy next.config existence checks. Real values are Worker
      # secrets at runtime (synced below).
      #
      # --webpack, not Turbopack (Next 16's default): the Workers-specific
      # IgnorePlugins for sharp/deasync live in next.config's webpack() hook,
      # and Turbopack emits a hashed `sharp-<hash>` alias OpenNext's esbuild
      # cannot resolve.
      - name: next build (webpack)
        env:
          BUILD_STANDALONE: "true"
          NEXT_TELEMETRY_DISABLED: "1"
          SKIP_DB_MIGRATIONS: "1"
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_PUBLIC_WEBAPP_URL: https://book.teddessert.com
          NEXT_PUBLIC_CONVEX_URL: https://effervescent-dinosaur-191.convex.cloud
          NEXT_PUBLIC_CONVEX_SITE_URL: https://effervescent-dinosaur-191.convex.site
          NEXT_PUBLIC_APP_NAME: Ted Dessert
          NEXTAUTH_SECRET: placeholder-build-only-replaced-at-runtime
          CALENDSO_ENCRYPTION_KEY: placeholder-build-only
        run: yarn next build --webpack

      - name: OpenNext bundle
        run: |
          yarn opennextjs-cloudflare build --skipNextBuild
          echo "worker.js: $(du -h .open-next/worker.js | cut -f1) (limit 64 MiB uncompressed)"
          echo "assets: $(find .open-next/assets -type f | wc -l) files, $(du -sh .open-next/assets | cut -f1)"

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: yarn wrangler deploy

      # After deploy so the Worker exists. Secrets persist across deploys, so
      # this is a sync, not a one-off. jq builds the JSON so values with
      # quotes or spaces survive.
      - name: Sync Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          CALENDSO_ENCRYPTION_KEY: ${{ secrets.CALENDSO_ENCRYPTION_KEY }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_NAME: ${{ secrets.OWNER_NAME }}
          OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}
        run: |
          for v in NEXTAUTH_SECRET CALENDSO_ENCRYPTION_KEY OWNER_PASSWORD OWNER_EMAIL OWNER_NAME OWNER_USERNAME; do
            [ -n "${!v}" ] || { echo "::error::repo secret $v is empty"; exit 1; }
          done
          jq -n --arg a "$NEXTAUTH_SECRET" --arg b "$CALENDSO_ENCRYPTION_KEY" \
                --arg c "$OWNER_PASSWORD" --arg d "$OWNER_EMAIL" \
                --arg e "$OWNER_NAME" --arg f "$OWNER_USERNAME" \
            '{NEXTAUTH_SECRET:$a, CALENDSO_ENCRYPTION_KEY:$b, OWNER_PASSWORD:$c,
              OWNER_EMAIL:$d, OWNER_NAME:$e, OWNER_USERNAME:$f}' \
            | yarn wrangler secret bulk

      - name: Smoke
        run: |
          for i in $(seq 1 10); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" https://book.teddessert.com/owner-login || echo 000)
            echo "attempt $i: /owner-login -> $code"
            case "$code" in 200|307) exit 0 ;; esac
            sleep 15
          done
          echo "::error::book.teddessert.com/owner-login never answered 200/307"
          exit 1
